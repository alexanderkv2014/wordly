<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Wordly — Офлайн Карточки</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f46e5">
</head>
<body>
    <div class="app-container">
        <!-- Шапка -->
        <header class="app-header">
            <h1 id="header-title">Изучение</h1>
            <div id="card-counter" class="card-counter">0 / 0</div>
        </header>

        <!-- Основной контент -->
        <main class="app-content">
            <!-- ЭКРАН 1: ОБУЧЕНИЕ (ИЗУЧЕНИЕ) -->
            <section id="screen-learn" class="screen active">
                <div class="card-container">
                    <div id="flashcard" class="flashcard">
                        <div class="card-inner">
                            <div class="card-front">
                                <span class="card-word" id="card-front-word">Загрузка...</span>
                                <span class="card-hint">Нажмите, чтобы перевернуть</span>
                            </div>
                            <div class="card-back">
                                <span class="card-translation" id="card-back-translation">...</span>
                                <p class="card-example" id="card-back-example"></p>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="controls-container">
                    <button id="btn-dont-know" class="action-btn dont-know">
                        <span class="btn-icon">✕</span>
                        <span>Не знаю</span>
                    </button>
                    <button id="btn-know" class="action-btn know">
                        <span class="btn-icon">✓</span>
                        <span>Знаю</span>
                    </button>
                </div>
            </section>

            <!-- ЭКРАН 2: БИБЛИОТЕКА И ДОБАВЛЕНИЕ -->
            <section id="screen-library" class="screen">
                <div class="add-word-block">
                    <h3>Добавить новое слово</h3>
                    <form id="add-card-form" class="add-form">
                        <input type="text" id="input-word" placeholder="Слово на английском (e.g. Apple)" required autocomplete="off">
                        <input type="text" id="input-translation" placeholder="Перевод (e.g. Яблоко)" required autocomplete="off">
                        <input type="text" id="input-example" placeholder="Пример (e.g. I eat an apple)" autocomplete="off">
                        <button type="submit" class="submit-btn">Добавить в словарь</button>
                    </form>
                </div>

                <div class="library-block">
                    <div class="library-header">
                        <h3>Мои слова</h3>
                        <input type="text" id="search-input" placeholder="Поиск по словам..." class="search-bar">
                    </div>
                    <div id="words-list" class="words-list">
                        <!-- Карточки будут рендериться тут -->
                    </div>
                </div>
            </section>

            <!-- ЭКРАН 3: НАСТРОЙКИ И ДАННЫЕ -->
            <section id="screen-settings" class="screen">
                <div class="settings-group">
                    <h3>Данные и Резервное копирование</h3>
                    <p class="settings-desc">Сохраняйте карточки в файл для переноса на другое устройство или восстанавливайте из копии.</p>
                    
                    <div class="settings-actions">
                        <button id="btn-export" class="settings-btn export">
                            <span>📤 Экспортировать в JSON</span>
                        </button>
                        
                        <label class="settings-btn import">
                            <span>📥 Импортировать из JSON</span>
                            <input type="file" id="file-import" accept=".json" style="display: none;">
                        </label>
                    </div>
                </div>

                <div class="settings-group danger-zone">
                    <h3>Опасная зона</h3>
                    <button id="btn-clear-data" class="danger-btn">Сбросить весь прогресс и слова</button>
                </div>
            </section>
        </main>

        <!-- Нижняя Навигация -->
        <nav class="bottom-nav">
            <button class="nav-btn active" data-target="screen-learn">
                <span class="nav-icon">🎴</span>
                <span class="nav-label">Карточки</span>
            </button>
            <button class="nav-btn" data-target="screen-library">
                <span class="nav-icon">📚</span>
                <span class="nav-label">Библиотека</span>
            </button>
            <button class="nav-btn" data-target="screen-settings">
                <span class="nav-icon">⚙️</span>
                <span class="nav-label">Настройки</span>
            </button>
        </nav>
    </div>

    <script src="app.js"></script>
</body>
</html>
