<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WORDLY</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section id="tab-home" class="tab-content active">
        <header class="app-header">
            <div class="brand-title">
                <span class="s-all-tag">WORDLY</span>
                <h1>Главная</h1>
            </div>
            <button class="profile-avatar" id="open-profile-btn" aria-label="Профиль">A</button>
        </header>
        <main class="content-scroll">
            <div class="menu-list">
                <div class="menu-item" onclick="startStudy('cards')">
                    <div class="menu-icon icon-blue">🎴</div>
                    <div class="menu-info">
                        <div class="title">Карточки</div>
                        <div class="subtitle">Изучайте новые слова по карточкам</div>
                    </div>
                    <span class="chevron">›</span>
                </div>
                <div class="menu-item" onclick="startStudy('learn')">
                    <div class="menu-icon icon-purple">📚</div>
                    <div class="menu-info">
                        <div class="title">Обучение</div>
                        <div class="subtitle">Практика и тесты по грамматике</div>
                    </div>
                    <span class="chevron">›</span>
                </div>
            </div>
        </main>
    </section>

    <script src="script.js"></script>
</body>
</html>
